apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: dev-default-deny
  namespace: dev
spec: {}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-health-probes
  namespace: dev
spec:
  action: ALLOW
  rules:
    - to:
        - operation:
            methods: ["GET"]
            paths:
              - /actuator/health
              - /actuator/health/*
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-istio-ingress-to-storefront-bff
  namespace: dev
spec:
  action: ALLOW
  selector:
    matchLabels:
      app.kubernetes.io/name: storefront-bff
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/service-mesh/sa/istio-ingressgateway-service-account
              - cluster.local/ns/dev/sa/mesh-curl-allowed
---

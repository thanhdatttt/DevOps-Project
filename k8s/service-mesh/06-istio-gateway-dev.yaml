apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: dev-yas-public-gateway
  namespace: dev
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - dev.storefront.yas.local.com
        - dev.backoffice.yas.local.com
        - dev.api.yas.local.com
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: storefront-public
  namespace: dev
spec:
  hosts:
    - dev.storefront.yas.local.com
  gateways:
    - dev-yas-public-gateway
  http:
    - route:
        - destination:
            host: storefront-bff.dev.svc.cluster.local
            port:
              number: 80
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: backoffice-public
  namespace: dev
spec:
  hosts:
    - dev.backoffice.yas.local.com
  gateways:
    - dev-yas-public-gateway
  http:
    - route:
        - destination:
            host: backoffice-bff.dev.svc.cluster.local
            port:
              number: 80
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: swagger-public
  namespace: dev
spec:
  hosts:
    - dev.api.yas.local.com
  gateways:
    - dev-yas-public-gateway
  http:
    # 1. Swagger UI Frontend
    - match:
        - uri:
            prefix: /swagger-ui
      route:
        - destination:
            host: swagger-ui.dev.svc.cluster.local 
            port:
              number: 8080

    # 2. Product API Docs
    - match:
        - uri:
            prefix: /product
      route:
        - destination:
            host: product.dev.svc.cluster.local
            port:
              number: 80

    # 3. Media API Docs
    - match:
        - uri:
            prefix: /media
      route:
        - destination:
            host: media.dev.svc.cluster.local
            port:
              number: 80

    # 4. Customer API Docs
    - match:
        - uri:
            prefix: /customer
      route:
        - destination:
            host: customer.dev.svc.cluster.local
            port:
              number: 80

    # 5. Cart API Docs
    - match:
        - uri:
            prefix: /cart
      route:
        - destination:
            host: cart.dev.svc.cluster.local
            port:
              number: 80

    # 6. Order API Docs
    - match:
        - uri:
            prefix: /order
      route:
        - destination:
            host: order.dev.svc.cluster.local
            port:
              number: 80

    # 7. Inventory API Docs
    - match:
        - uri:
            prefix: /inventory
      route:
        - destination:
            host: inventory.dev.svc.cluster.local
            port:
              number: 80

    # 8. Tax API Docs
    - match:
        - uri:
            prefix: /tax
      route:
        - destination:
            host: tax.dev.svc.cluster.local
            port:
              number: 80

    # 9. Search API Docs
    - match:
        - uri:
            prefix: /search
      route:
        - destination:
            host: search.dev.svc.cluster.local
            port:
              number: 80

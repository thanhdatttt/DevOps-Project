apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: staging-default-deny
  namespace: staging
spec: {}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-health-probes
  namespace: staging
spec:
  action: ALLOW
  rules:
    - to:
        - operation:
            methods: ["GET"]
            paths:
              - /actuator/health
              - /actuator/health/*
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-observability-prometheus
  namespace: staging
spec:
  action: ALLOW
  # Metrics port 8090 has mTLS disabled so Prometheus can scrape from the
  # non-mesh observability namespace. Source namespace/principal matches require
  # mTLS, so keep this allow-list scoped to only the metrics operation.
  rules:
    - to:
        - operation:
            methods: ["GET"]
            ports: ["8090"]
            paths:
              - /actuator/prometheus
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-istio-ingress-to-storefront-bff
  namespace: staging
spec:
  action: ALLOW
  selector:
    matchLabels:
      app.kubernetes.io/name: storefront-bff
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/service-mesh/sa/istio-ingressgateway-service-account
---

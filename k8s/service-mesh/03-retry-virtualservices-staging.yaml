# Retry policy for staging YAS HTTP services. Retries are executed by the caller sidecar.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: backoffice-bff-retry-on-5xx
  namespace: staging
spec:
  hosts:
    - backoffice-bff.staging.svc.cluster.local
  gateways:
    - mesh
  http:
    - timeout: 10s
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: 5xx,connect-failure,refused-stream,reset,gateway-error
      route:
        - destination:
            host: backoffice-bff.staging.svc.cluster.local
            port:
              number: 80
---

apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: envoy-sidecar-podmonitor-staging
  namespace: observability
  labels:
    app: envoy-sidecar-podmonitor
    release: prometheus
spec:
  namespaceSelector:
    matchNames:
      - staging
  selector: {}
  podMetricsEndpoints:
    - interval: 15s
      path: /stats/prometheus
      scheme: http
      targetPort: 15090

# Retry policy for dev YAS HTTP services. Retries are executed by the caller sidecar.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: backoffice-bff-retry-on-5xx
  namespace: dev
spec:
  hosts:
    - backoffice-bff.dev.svc.cluster.local
  gateways:
    - mesh
  http:
    - timeout: 10s
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: 5xx,connect-failure,refused-stream,reset,gateway-error
      route:
        - destination:
            host: backoffice-bff.dev.svc.cluster.local
            port:
              number: 80
---

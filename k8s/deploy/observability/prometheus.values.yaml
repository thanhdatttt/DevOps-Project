hostname: &grafanaHostname grafana.yas.local.com
prometheusHostname: &prometheusHostname prometheus.yas.local.com
prometheus:
  ingress:
    ingressClassName: nginx
    enabled: true
    hosts:
      - *prometheusHostname
    paths:
      - /
    pathType: Prefix
  prometheusSpec:
    enableRemoteWriteReceiver: true
grafana:
  grafana.ini:
    database:
      type: postgres
      host: postgresql.postgres:5432
      name: grafana
      user: yasadminuser
      password: admin
      ssl_mode: require
  adminUser: admin
  adminPassword: admin
  ingress:
    ingressClassName: nginx
    enabled: true
    hosts:
      - *grafanaHostname

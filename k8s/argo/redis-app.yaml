apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis
  namespace: argocd
  annotations:
    # Databases should start early. Wave -2 matches standard infrastructure flows.
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  sources:
    # 1. Pull your configuration files
    - repoURL: 'https://github.com/thanhdatttt/DevOps-Project.git' # Replace with your repo
      ref: values 
    
    # 2. Pull the Bitnami Redis chart from the OCI registry
    - repoURL: 'registry-1.docker.io/bitnamicharts' # Notice: NO 'oci://' prefix here
      chart: redis
      targetRevision: 19.6.1 # ALWAYS pin versions for third-party charts!
      helm:
        valueFiles:
          # See the crucial note below about why this file needs to be specific
          - $values/k8s/argo/redis-values.yaml 

  destination:
    server: 'https://kubernetes.default.svc'
    namespace: redis

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
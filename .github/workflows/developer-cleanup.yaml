name: CD - developer_cleanup

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Reset all services to 'latest' tag? (yes / no)"
        required: true
        default: 'no'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm == 'yes' }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq

      - name: Reset all charts to latest
        run: |
          find k8s/charts/ -name "values.yaml" -exec yq -i '.image.tag = "latest"' {} +
          echo "All image tags reset to 'latest'"

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/charts/ 
          git diff --cached --quiet && echo "Nothing to reset" && exit 0
          git commit -m "GitOps: Cleanup - Reset all tags to latest [skip ci]"
          git push origin main

      - name: Trigger ArgoCD Sync All
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          SERVICES=(
            backoffice-bff-dev cart-dev customer-dev inventory-dev
            location-dev media-dev order-dev payment-dev payment-paypal-dev
            product-dev promotion-dev rating-dev recommendation-dev
            sampledata-dev search-dev storefront-bff-dev tax-dev webhook-dev
          )
          for app in ${SERVICES[@]}; do
            curl -s -X POST \
              -H "Authorization: Bearer $ARGOCD_TOKEN" \
              "https://$ARGOCD_SERVER/api/v1/applications/$app/sync" \
              -d '{"prune":true}' || true
          done
          echo "Complete Cleanup + sync"
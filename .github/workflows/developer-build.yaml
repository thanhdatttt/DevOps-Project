name: CD - developer_build

on:
  workflow_dispatch:
    inputs:
      backoffice_bff_branch:
        description: 'backoffice-bff branch'
        required: false
        default: 'main'
      cart_branch:
        description: 'cart branch'
        required: false
        default: 'main'
      customer_branch:
        description: 'customer branch'
        required: false
        default: 'main'
      inventory_branch:
        description: 'inventory branch'
        required: false
        default: 'main'
      location_branch:
        description: 'location branch'
        required: false
        default: 'main'
      media_branch:
        description: 'media branch'
        required: false
        default: 'main'
      order_branch:
        description: 'order branch'
        required: false
        default: 'main'
      payment_branch:
        description: 'payment branch'
        required: false
        default: 'main'
      payment_paypal_branch:
        description: 'payment-paypal branch'
        required: false
        default: 'main'
      product_branch:
        description: 'product branch'
        required: false
        default: 'main'
      promotion_branch:
        description: 'promotion branch'
        required: false
        default: 'main'
      rating_branch:
        description: 'rating branch'
        required: false
        default: 'main'
      recommendation_branch:
        description: 'recommendation branch'
        required: false
        default: 'main'
      sampledata_branch:
        description: 'sampledata branch'
        required: false
        default: 'main'
      search_branch:
        description: 'search branch'
        required: false
        default: 'main'
      storefront_bff_branch:
        description: 'storefront-bff branch'
        required: false
        default: 'main'
      tax_branch:
        description: 'tax branch'
        required: false
        default: 'main'
      webhook_branch:
        description: 'webhook branch'
        required: false
        default: 'main'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  gitops:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install yq
        run: |
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq

      - name: Update helm values
        run: |
          SERVICES=(
            backoffice-bff cart customer inventory
            location media order payment payment-paypal product
            promotion rating recommendation sampledata search
            storefront-bff tax webhook
          )

          for svc in ${SERVICES[@]}; do
            input_key="${svc//-/_}_branch"

            # Đọc branch input từ workflow_dispatch — dùng env để tránh script injection
            branch_name="${{ toJson(github.event.inputs) }}"
            branch_name=$(echo "$branch_name" | jq -r --arg key "$input_key" '.[$key] // "main"')

            # main hoặc rỗng → tag latest
            if [ -z "$branch_name" ] || [ "$branch_name" = "main" ]; then
              tag="latest"
            else
              # ✅ Fix: dùng đúng $branch_name thay vì $BRANCH
              tag=$(git ls-remote origin "refs/heads/$branch_name" | cut -f1)
              if [ -z "$tag" ]; then
                echo "⚠️  Branch '$branch_name' not found for '$svc' → fallback to latest"
                tag="latest"
              else
                # Dùng short SHA (7 ký tự) cho dễ đọc
                tag="${tag:0:7}"
              fi
            fi

            FILE_PATH="k8s/charts/$svc/values.yaml" 

            if [ -f "$FILE_PATH" ]; then
              echo "✅ $svc → tag: $tag"
              yq -i ".image.tag = \"$tag\"" "$FILE_PATH"
            else
              echo "⚠️  $FILE_PATH not found, skipping"
            fi
          done

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/charts/ 
          # Chỉ commit nếu có thay đổi thực sự
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "GitOps: dev-build - Update image tags [skip ci]"
          git push origin main

      - name: Trigger ArgoCD Sync
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }} 
          ARGOCD_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          # Sync tất cả app thuộc project developer (hoặc liệt kê từng app)
          SERVICES=(
            backoffice-bff-dev cart-dev customer-dev inventory-dev
            location-dev media-dev order-dev payment-dev payment-paypal-dev
            product-dev promotion-dev rating-dev recommendation-dev
            sampledata-dev search-dev storefront-bff-dev tax-dev webhook-dev
          )
          for app in ${SERVICES[@]}; do
            echo "Syncing ArgoCD app: $app"
            curl -s -X POST \
              -H "Authorization: Bearer $ARGOCD_TOKEN" \
              -H "Content-Type: application/json" \
              "https://$ARGOCD_SERVER/api/v1/applications/$app/sync" \
              -d '{"prune":false,"dryRun":false}' || echo "⚠️  Sync $app failed (non-blocking)"
          done

      - name: Print Developer Access Info
        run: |
          # Worker node IP — lưu trong secret hoặc hardcode nếu cố định
          WORKER_IP="${{ secrets.K8S_WORKER_IP }}" 

          echo ""
          echo "👉 Add bellow code line to your file hosts:"
          echo "   (Windows: C:\\Windows\\System32\\drivers\\etc\\hosts)"
          echo "   (Linux/Mac: /etc/hosts)"
          echo ""
          echo "   $WORKER_IP  dev.backoffice.local"
          echo "   $WORKER_IP  dev.storefront.local"
          echo "   $WORKER_IP  dev.api.local"
          echo ""
          echo "📌 NodePort endpoints:"
          echo "   Storefront BFF : http://dev.storefront.local:30001"
          echo "   Backoffice BFF : http://dev.backoffice.local:30002"
          echo "   API Gateway    : http://dev.api.local:30000"
          echo ""
          echo "⚠️  ArgoCD sync can take a few minutes to complete pod restart"
          echo "=========================================="
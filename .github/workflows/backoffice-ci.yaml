name: backoffice service ci

on:
  push:
    branches: ["main"]
    paths:
      - "backoffice/**"
      - ".github/workflows/backoffice-ci.yaml"
  pull_request:
    branches: ["main"]
    paths:
      - "backoffice/**"
      - ".github/workflows/backoffice-ci.yaml"
  workflow_dispatch:

env:
  FROM_ORIGINAL_REPOSITORY: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
  APP_DIR: backoffice
  IMAGE_NAME: ghcr.io/thanhdatttt/yas-backoffice

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks check
        run: |
          docker pull zricethezav/gitleaks:latest
          docker run --rm -v ${{ github.workspace }}:/work -w /work zricethezav/gitleaks:latest detect --source="./backoffice" --config="/work/gitleaks.toml" --verbose --no-git

  test:
    runs-on: ubuntu-latest
    needs: gitleaks
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backoffice/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backoffice

      - name: Build application
        run: npm run build
        working-directory: backoffice

      - name: Lint
        run: npm run lint
        working-directory: backoffice

      - name: Check formatting
        run: npx prettier --check .
        working-directory: backoffice

      - name: SonarCloud Scan
        if: ${{ env.FROM_ORIGINAL_REPOSITORY == 'true' }}
        uses: SonarSource/sonarcloud-github-action@master
        with:
          projectBaseDir: backoffice
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Upload Next.js build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backoffice-next-build
          path: |
            backoffice/.next/standalone
            backoffice/.next/static
            backoffice/public
            backoffice/package.json
          if-no-files-found: error
          retention-days: 1

  build:
    runs-on: ubuntu-latest
    needs: test
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Next.js build artifact
        uses: actions/download-artifact@v4
        with:
          name: backoffice-next-build
          path: backoffice

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image from artifact
        uses: docker/build-push-action@v6
        with:
          context: ./backoffice
          file: ./backoffice/Dockerfile.ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/thanhdatttt/yas-backoffice:latest
            ghcr.io/thanhdatttt/yas-backoffice:${{ github.sha }}

      - name: Run Trivy image scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/thanhdatttt/yas-backoffice:latest
          format: sarif
          output: trivy-image-results.sarif

      - name: Push Docker image
        run: |
          docker push ghcr.io/thanhdatttt/yas-backoffice:latest
          docker push ghcr.io/thanhdatttt/yas-backoffice:${{ github.sha }}

      - name: Upload Trivy image scan results
        uses: github/codeql-action/upload-sarif@v4
        if: ${{ always() && hashFiles('trivy-image-results.sarif') != '' }}
        with:
          sarif_file: trivy-image-results.sarif

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backoffice/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backoffice

      - name: Audit production dependencies
        run: npm audit --omit=dev
        continue-on-error: true
        working-directory: backoffice

      - name: Run Trivy filesystem scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ./backoffice
          format: sarif
          output: trivy-fs-results.sarif

      - name: Upload Trivy filesystem scan results
        uses: github/codeql-action/upload-sarif@v4
        if: ${{ always() && hashFiles('trivy-fs-results.sarif') != '' }}
        with:
          sarif_file: trivy-fs-results.sarif

name: image for release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-push-backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true 
      matrix:
        service:
          - inventory
          - tax
          - customer
          # - webhook
          - media
          - search
          - storefront-bff
          - order
          - backoffice-bff
          # - location
          # - rating
          - sampledata
          # - payment-paypal
          # - recommendation
          - product
          # - payment
          # - promotion
          - cart

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'adopt'
      
      # We dynamically inject the service name into the Maven command
      - name: Run Maven Build for ${{ matrix.service }}
        run: mvn clean package -DskipTests -pl ${{ matrix.service }} -am
        
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      # We dynamically inject the service name into the Docker context and tag
      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/thanhdatttt/yas-${{ matrix.service }}:${{ github.ref_name }}

  build-and-push-frontend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true 
      matrix:
        service:
          - backoffice
          - storefront

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./${{ matrix.service }}/package-lock.json
      
      - name: Install and Build ${{ matrix.service }}
        working-directory: ./${{ matrix.service }}
        run: |
          npm ci
          npm run build

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ghcr.io/thanhdatttt/yas-${{ matrix.service }}:${{ github.ref_name }}

  update-staging-values:
    needs:
      - build-and-push-backend
      - build-and-push-frontend
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update tags using yq
        run: |
          # Define your array of services
          SERVICES=(
            "inventory"
            "tax"
            "customer"
            # "webhook"
            "media"
            "search"
            "storefront-bff"
            "order"
            "backoffice-bff"
            # "location"
            # "rating"
            "sampledata"
            # "payment-paypal"
            # "recommendation"
            "product"
            # "payment"
            # "promotion"
            "cart"
          )

          UI=(
            "storefront-ui"
            "backoffice-ui"
          )

          # Loop through each service and safely update the YAML file
          for service in "${SERVICES[@]}"; do
            echo "Updating $service to tag ${{ github.ref_name }}..."
            
            # yq is pre-installed on ubuntu-latest runners. 
            # It safely modifies YAML without destroying comments or formatting.
            # NOTE: If your values file uses a different path than `image.tag`, adjust the ".image.tag" part below.
            yq -i ".backend.image.tag = \"${{ github.ref_name }}\"" k8s/charts/$service/values-staging.yaml
          done

          for ui in "${UI[@]}"; do
            echo "Updating $ui to tag ${{ github.ref_name }}..."
            yq -i ".ui.image.tag = \"${{ github.ref_name }}\"" k8s/charts/$ui/values-staging.yaml
          done

      - name: Commit and Push changes
        run: |
          # Configure the Git user as the official GitHub Actions bot
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Stage the modified files
          git add k8s/charts/*/values-staging.yaml
          
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          
          # Commit with [skip ci] to prevent infinite workflow loops
          git commit -m "chore(cd): update staging image tags to ${{ github.ref_name }} [skip ci]"
          
          # Push with a retry/rebase loop to avoid race conditions
          for attempt in 1 2 3; do
            if git push origin main; then
              break
            else
              echo "⚠️ Push failed due to remote changes. Rebasing and retrying ($attempt/3)..."
              git pull --rebase origin main
            fi
          done
